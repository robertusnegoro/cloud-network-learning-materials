<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#glow)" stroke-width="8" stroke-dasharray="10 5" opacity="0.4" />
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#grad1)" stroke-width="3" />
  
  <!-- Network nodes -->
  <line x1="100" y1="45" x2="55" y2="125" stroke="#60a5fa" stroke-width="2.5" />
  <line x1="100" y1="45" x2="145" y2="125" stroke="#60a5fa" stroke-width="2.5" />
  <line x1="55" y1="125" x2="145" y2="125" stroke="#60a5fa" stroke-width="2.5" />
  <line x1="100" y1="45" x2="100" y2="155" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 2" />
  <line x1="55" y1="125" x2="100" y2="100" stroke="#a78bfa" stroke-width="2" />
  <line x1="145" y1="125" x2="100" y2="100" stroke="#a78bfa" stroke-width="2" />

  <!-- Node points -->
  <circle cx="100" cy="45" r="10" fill="#3b82f6" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="55" cy="125" r="10" fill="#8b5cf6" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="145" cy="125" r="10" fill="#ec4899" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="100" cy="100" r="12" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="100" cy="155" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
